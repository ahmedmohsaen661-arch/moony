<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نبض العضلة - مركز الحجامة والاستشفاء العضلي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#4A6B5B', secondary: '#D4C5A9', accent: '#8C6D4F', darkBg: '#1E292B', lightBg: '#F9F8F6' },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'], tajawal: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #F9F8F6; color: #2D3748; } .smooth-shadow { box-shadow: 0 4px 20px rgba(74, 107, 91, 0.08); } </style>
</head>
<body x-data="appData()" x-init="init()" class="bg-lightBg font-cairo antialiased">

    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100 smooth-shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary text-2xl font-bold">
                    <i class="fa-solid fa-hand-holding-medical"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black text-primary tracking-tight">نبض العضلة</h1>
                    <p class="text-xs text-gray-500 font-medium">للحجامة والاستشفاء العضلي</p>
                </div>
            </a>
            <nav class="hidden md:flex items-center gap-8 font-semibold text-gray-600">
                <a href="#services" class="hover:text-primary transition">الجلسات</a>
                <a href="#booking" class="bg-primary text-white px-5 py-2.5 rounded-full hover:bg-primary/90 transition shadow-md">حجز موعد</a>
            </nav>
            <div>
                <button @click="toggleAdminView()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-primary"></i> <span x-text="isAdminView ? 'موقع الزوار' : 'لوحة التحكم'"></span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- Visitor View -->
        <div x-show="!isAdminView">
            <section class="relative bg-gradient-to-b from-primary/10 to-lightBg py-16 sm:py-24 text-center">
                <div class="max-w-7xl mx-auto px-4">
                    <h2 class="text-3xl sm:text-5xl font-black text-gray-900 mb-6">استعد نشاط جسدك وتخلص من آلامك</h2>
                    <p class="text-gray-600 text-lg max-w-2xl mx-auto mb-8">جلسات الحجامة والاستشفاء العضلي بإشراف ك/ يوسف صيام.</p>
                    <a href="#booking" class="bg-primary text-white px-8 py-3.5 rounded-xl font-bold text-lg shadow-lg">احجز موعدك الآن</a>
                </div>
            </section>

            <!-- Services Section -->
            <section id="services" class="py-16 max-w-7xl mx-auto px-4">
                <h3 class="text-2xl font-black text-center text-gray-900 mb-12">أنواع الجلسات المتاحة</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <template x-for="service in services.filter(s => !s.hidden)" :key="service.id">
                        <div class="bg-white rounded-2xl overflow-hidden smooth-shadow border p-6 flex flex-col">
                            <h4 class="text-xl font-bold text-gray-900 mb-2" x-text="service.name"></h4>
                            <p class="text-primary font-bold mb-4" x-text="service.price + ' جنيه'"></p>
                            <p class="text-gray-600 text-sm mb-6 flex-grow" x-text="service.description"></p>
                            <button @click="selectServiceForBooking(service.name)" class="w-full bg-primary/10 text-primary font-bold py-3 rounded-xl hover:bg-primary hover:text-white transition">احجز هذه الجلسة</button>
                        </div>
                    </template>
                </div>
            </section>

            <!-- Booking Section -->
            <section id="booking" class="py-16 bg-primary/5 border-t">
                <div class="max-w-3xl mx-auto px-4">
                    <div class="bg-white p-8 rounded-3xl smooth-shadow">
                        <h3 class="text-2xl font-black text-center text-gray-900 mb-6">حجز موعد جلسة</h3>
                        <form @submit.prevent="submitBooking" class="space-y-4">
                            <input type="text" x-model="bookingForm.name" required placeholder="الاسم الكامل" class="w-full px-4 py-3 rounded-xl border">
                            <input type="tel" x-model="bookingForm.phone" required placeholder="رقم الهاتف (010xxxxxxxx)" class="w-full px-4 py-3 rounded-xl border">
                            <select x-model="bookingForm.service" required class="w-full px-4 py-3 rounded-xl border bg-white">
                                <option value="">-- اختر الجلسة --</option>
                                <template x-for="service in services.filter(s => !s.hidden)" :key="service.id">
                                    <option :value="service.name" x-text="service.name"></option>
                                </template>
                            </select>
                            <select x-model="bookingForm.selectedDay" required class="w-full px-4 py-3 rounded-xl border bg-white">
                                <option value="">-- اختر اليوم --</option>
                                <template x-for="day in daysOfWeek" :key="day">
                                    <option :value="day" x-text="day"></option>
                                </template>
                            </select>
                            <select x-model="bookingForm.slotId" required class="w-full px-4 py-3 rounded-xl border bg-white">
                                <option value="">-- اختر الموعد --</option>
                                <template x-for="slot in availableSlots.filter(s => s.day === bookingForm.selectedDay && !s.booked)" :key="slot.id">
                                    <option :value="slot.id" x-text="slot.time"></option>
                                </template>
                            </select>
                            <button type="submit" class="w-full bg-[#25D366] text-white font-bold py-4 rounded-xl shadow-lg">تأكيد الحجز وإرسال التفاصيل عبر واتساب</button>
                        </form>
                    </div>
                </div>
            </section>
        </div>

        <!-- Admin View -->
        <div x-show="isAdminView" class="py-12 max-w-7xl mx-auto px-4">
            <template x-if="!isAdminLoggedIn">
                <div class="max-w-md mx-auto bg-white p-8 rounded-3xl smooth-shadow text-center">
                    <h3 class="text-2xl font-black mb-4">لوحة تحكم المالك</h3>
                    <form @submit.prevent="adminLogin" class="space-y-4">
                        <input type="password" x-model="adminPasswordInput" required placeholder="كلمة المرور" class="w-full px-4 py-3 rounded-xl border">
                        <button type="submit" class="w-full bg-primary text-white font-bold py-3 rounded-xl">دخول</button>
                    </form>
                </div>
            </template>

            <template x-if="isAdminLoggedIn">
                <div class="space-y-8">
                    <div class="bg-white p-6 rounded-2xl flex justify-between items-center smooth-shadow">
                        <h2 class="text-xl font-bold">لوحة التحكم السحابية</h2>
                        <button @click="isAdminLoggedIn = false" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl font-bold">خروج</button>
                    </div>

                    <!-- Services Management -->
                    <div class="bg-white p-6 rounded-2xl smooth-shadow">
                        <h3 class="text-lg font-bold mb-4">إضافة جلسة جديدة (تظهر للجميع فوراً)</h3>
                        <form @submit.prevent="addService" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                            <input type="text" x-model="newService.name" required placeholder="اسم الجلسة" class="px-4 py-2 border rounded-xl">
                            <input type="number" x-model="newService.price" required placeholder="السعر" class="px-4 py-2 border rounded-xl">
                            <button type="submit" class="bg-primary text-white font-bold py-2 rounded-xl">حفظ وإضافة</button>
                        </form>
                        <div class="space-y-2">
                            <template x-for="service in services" :key="service.id">
                                <div class="flex justify-between items-center p-3 border rounded-xl bg-gray-50">
                                    <span class="font-bold" x-text="service.name + ' (' + service.price + ' جنيه)'"></span>
                                    <button @click="deleteService(service.id)" class="text-red-500 font-bold text-xs">حذف</button>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <script>
        // إعدادات الاتصال السحابي بقاعدة البيانات
        const SUPABASE_URL = 'https://iranqsckrzkzyqmmcgly.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_YHyJ-kcmWC3achKnEGJHLA_QJDqjF8a';
        
        let supabaseClient = null;
        if (SUPABASE_URL) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        function appData() {
            return {
                isAdminView: false,
                isAdminLoggedIn: false,
                adminPasswordInput: '',
                daysOfWeek: ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'],
                services: [],
                availableSlots: [],
                bookingForm: { name: '', phone: '', service: '', selectedDay: '', slotId: '' },
                newService: { name: '', price: '', description: 'جلسة علاجية', image: 'https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=600&q=80', hidden: false },

                async init() {
                    if (supabaseClient) {
                        const { data: sData } = await supabaseClient.from('services').select('*');
                        if (sData && sData.length > 0) this.services = sData;

                        const { data: slotData } = await supabaseClient.from('slots').select('*');
                        if (slotData && slotData.length > 0) this.availableSlots = slotData;
                    }
                },

                adminLogin() {
                    if (this.adminPasswordInput === '2026') { this.isAdminLoggedIn = true; }
                    else { alert('كلمة المرور غير صحيحة'); }
                },

                async addService() {
                    if (supabaseClient) {
                        const { data, error } = await supabaseClient.from('services').insert([{
                            name: this.newService.name,
                            price: Number(this.newService.price),
                            description: this.newService.description,
                            image: this.newService.image,
                            hidden: false
                        }]).select();

                        if (!error && data) {
                            this.services.push(data[0]);
                            this.newService.name = ''; this.newService.price = '';
                            alert('✅ تم الحفظ سحابياً وستظهر الجلسة لجميع الزوار فوراً!');
                        }
                    }
                },

                async deleteService(id) {
                    if (supabaseClient) {
                        await supabaseClient.from('services').delete().eq('id', id);
                        this.services = this.services.filter(s => s.id !== id);
                        alert('🗑️ تم الحذف والتحديث لدى الجميع.');
                    }
                },

                selectServiceForBooking(name) {
                    this.bookingForm.service = name;
                    document.getElementById('booking')?.scrollIntoView({ behavior: 'smooth' });
                },

                async submitBooking() {
                    const slot = this.availableSlots.find(s => s.id == this.bookingForm.slotId);
                    if (!slot) return;
                    
                    if (supabaseClient) {
                        await supabaseClient.from('slots').update({ booked: true }).eq('id', slot.id);
                    }
                    slot.booked = true;

                    const msg = `حجز جديد:%0a- الاسم: ${this.bookingForm.name}%0a- الهاتف: ${this.bookingForm.phone}%0a- الجلسة: ${this.bookingForm.service}%0a- الموعد: ${slot.day} - ${slot.time}`;
                    window.open(`https://wa.me/201143310277?text=${msg}`, '_blank');
                    alert('تم الحجز بنجاح!');
                }
            }
        }
    </script>
</body>
</html>
